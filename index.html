<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Things About J &amp; J</title>
<style>
:root{--page:#e9e9ee;--ink:#222;--bar:#fff;--line:#e5e5e5;--chat:#b2c7d9;--me:#fee500;--other:#fff;--sub:#8a8a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0e0e12}}
:root[data-theme="dark"]{--page:#0e0e12}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","PingFang SC",sans-serif;display:flex;justify-content:center;align-items:center;color:var(--ink)}
.phone{width:100%;max-width:420px;height:100%;max-height:820px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;border-radius:0}
@media(min-width:500px){.phone{border-radius:28px;box-shadow:0 10px 40px #0005}}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
/* home */
#home{background:linear-gradient(160deg,#2b3a67,#6b4f8f 60%,#c9708f);color:#fff;padding:48px 24px 24px;align-items:center}
#clock{font-size:64px;font-weight:200;margin-top:20px}
#date{opacity:.85;margin-top:4px;font-size:14px}
#hint{margin-top:auto;font-size:13px;opacity:.85;text-align:center;line-height:1.6}
.apps{display:flex;gap:20px;margin-top:60px}
.app{width:64px;text-align:center;font-size:11px;cursor:pointer}
.ico{width:60px;height:60px;border-radius:16px;background:#fee500;color:#3b1e1e;display:grid;place-items:center;font-weight:800;margin-bottom:6px;font-size:13px}
.ico.g{background:#ffffff33;color:#fff}
.badge{position:absolute;margin:-6px 0 0 44px;background:#f33;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
/* bars */
.top{height:52px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;font-weight:700;color:#222}
.top .sp{flex:1}
.top button{background:none;border:0;font-size:18px;cursor:pointer;color:#222}
.list{flex:1;overflow:auto;background:#fff}
.row{display:flex;gap:12px;padding:12px 16px;align-items:center;cursor:pointer;color:#222}
.row:active{background:#f3f3f3}
.av{width:46px;height:46px;border-radius:18px;background:#ccd;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.row .m{flex:1;min-width:0}
.row .n{font-weight:600;font-size:15px}
.row .p{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t{font-size:11px;color:var(--sub);text-align:right}
.row .c{background:#f33;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;display:inline-block;margin-top:4px}
.locked{opacity:.55}
/* chat */
#chat{background:var(--chat)}
#msgs{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:#0003;color:#fff;font-size:11px;border-radius:12px;padding:3px 12px;margin:6px 0}
.b{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.b.me{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:8px 11px;border-radius:14px;font-size:15px;line-height:1.4;background:var(--other);color:#222;white-space:pre-wrap;word-break:break-word}
.me .bub{background:var(--me)}
.zh{display:none;font-size:12px;color:#667;margin-top:4px;border-top:1px dashed #0002;padding-top:4px}
body.tr .zh{display:block}
.tm{font-size:10px;color:#445;opacity:.75;flex:none}
.nm{font-size:12px;color:#223;margin:4px 0 -2px 4px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#999;margin:0 2px;animation:d 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes d{50%{opacity:.2}}
.bar{display:flex;gap:8px;padding:8px 10px;background:#fff;align-items:center}
.bar input{flex:1;border:0;background:#f2f2f2;border-radius:20px;padding:10px 14px;font-size:15px;outline:none;color:#222;font-family:inherit}
.bar button{border:0;background:#fee500;border-radius:16px;padding:9px 14px;font-weight:700;cursor:pointer;color:#3b1e1e}
.bar button:disabled{opacity:.5}
.note{font-size:11px;color:#667;text-align:center;padding:4px;background:#fff}
#lock,#home{background:linear-gradient(160deg,#1f2a4d,#5a3f7e 60%,#c9708f);color:#fff;align-items:center}
#lock{padding:56px 24px 28px}
#lk1,#pad{flex:1;width:100%;flex-direction:column;align-items:center}
#lk1{display:flex}
.notif{margin-top:36px;width:100%;background:#ffffff2e;backdrop-filter:blur(12px);border-radius:18px;padding:12px 14px;font-size:13px;line-height:1.5;cursor:pointer}
.unl{margin-top:auto;font-size:13px;opacity:.85;cursor:pointer}
#pad .ttl{font-size:17px;margin-top:20px}
.pdots{display:flex;gap:16px;margin:26px 0 34px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.pdots i.f{background:#fff}
.shake{animation:sk .4s}
@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
.key{width:76px;height:76px;border-radius:50%;background:#ffffff2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;cursor:pointer;user-select:none}
.key small{font-size:9px;letter-spacing:2px;margin-top:-2px;opacity:.9}
.key:active{background:#ffffff66}
.key.e{background:none}
.key.t{font-size:15px;background:none}
.cancel{margin-top:auto;font-size:15px;cursor:pointer}
#lock,#home{background:radial-gradient(circle at 20% 15%,#7ec8ff 0,transparent 45%),radial-gradient(circle at 85% 35%,#b58cff 0,transparent 50%),radial-gradient(circle at 30% 90%,#ff8fb3 0,transparent 55%),linear-gradient(160deg,#3b6fe0,#7a4fd6);position:relative;overflow:hidden}


#lock>*,#home>*{position:relative;z-index:1}
.bub.meme{background:#111;color:#fff;border:2px solid #fff;font-weight:800;text-align:center;font-size:16px;padding:18px 14px;min-width:170px;line-height:1.5}
.kc{background:#fff;border-radius:14px;padding:14px;margin-top:12px;font-size:14px}.kc input{width:100%;margin:8px 0;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none}.kc button{width:100%;padding:10px;border:0;border-radius:10px;background:#fee500;font-weight:700;color:#3b1e1e;cursor:pointer;margin-top:4px}.kc small{display:block;margin-top:8px;font-size:11.5px;line-height:1.6;color:#777}
#choices{display:none;flex-direction:column;gap:8px;padding:10px 12px;background:#ffffffc8;max-height:46%;overflow:auto}
.cho{border:0;background:#fff;border-radius:14px;padding:10px 12px;text-align:left;font-size:14px;color:#222;line-height:1.4;cursor:pointer;box-shadow:0 1px 3px #0002;font-family:inherit}
.cho:active{background:#fff6a8}
.cho .zh{margin-top:3px;font-size:12px;color:#667;border-top:1px dashed #0002;padding-top:3px}
.day.nar{padding:8px 14px;border-radius:14px;text-align:center;max-width:88%;line-height:1.5}
.day .zh{color:#e8eef5;border-top:1px dashed #fff5}
.endcard{align-self:center;width:88%;background:#fff;border-radius:16px;padding:16px;text-align:center;margin:10px 0;box-shadow:0 2px 8px #0003;color:#222}
.endcard b{font-size:16px}
.endcard .zh{margin-top:4px}
.endcard button{margin-top:10px;border:0;border-radius:12px;padding:8px 16px;font-weight:700;cursor:pointer;background:#fee500;color:#3b1e1e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.tile{position:relative;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.tile span{font-size:44px}
.tile img,.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile small{position:absolute;left:0;right:0;bottom:0;background:#0006;color:#fff;font-size:10px;padding:3px 5px;text-align:left}
#viewer{position:absolute;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;color:#fff;padding:20px;text-align:center}
.big{position:relative;width:100%;max-width:340px;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.big span{font-size:110px}
.bar{display:none!important}
</style>
</head>
<body>
<div class="phone">

<div id="lock" class="screen on">
  <div id="lk1">
    <div style="font-size:20px">🔒</div>
    <div id="clock">00:00</div><div id="date"></div>
    <div class="notif" onclick="openPad()"><b>카카오톡 · 제제 ♡</b><br>오늘 몇 시에 끝나?</div>
    <div class="unl" onclick="openPad()">탭하여 잠금 해제</div>
  </div>
  <div id="pad" style="display:none">
    <div class="ttl" id="ptl">암호 입력</div>
    <div class="pdots" id="pd"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys"></div>
    <div class="cancel" onclick="closePad()">취소</div>
  </div>
</div>

<div id="home" class="screen">
  <div class="apps">
    <div class="app" onclick="show('list')"><span class="badge">1</span><div class="ico">TALK</div>카카오톡</div>
    <div class="app" onclick="show('album')"><div class="ico" style="background:#fff;color:#333">📷</div>사진</div>
    <div class="app" onclick="show('notes')"><div class="ico" style="background:#ffd60a;color:#fff">🗒</div>메모</div>
  </div>
  <div id="hint">카카오톡에 읽지 않은 메시지 1개<br>点 카카오톡 看看</div>
</div>

<div id="notes" class="screen" style="background:#f2f2f7">
  <div class="top"><button onclick="show('home')">‹</button>메모<span class="sp"></span><button class="trb" onclick="toggleTr()" style="font-size:13px;background:#0001;border-radius:10px;padding:3px 9px">中 翻译</button></div>
  <div class="list" id="nlist" style="background:#f2f2f7;padding:14px"></div>
</div>
<div id="note" class="screen" style="background:#fffdf3">
  <div class="top" style="background:#fffdf3"><button onclick="show('notes')">‹ 메모</button><span class="sp"></span><button class="trb" onclick="toggleTr()" style="font-size:13px;background:#0001;border-radius:10px;padding:3px 9px">中 翻译</button></div>
  <div class="list" id="nbody" style="background:#fffdf3;padding:20px"></div>
</div>

<div id="list" class="screen">
  <div class="top"><button onclick="show('home')">‹</button>채팅<span class="sp"></span><span style="font-weight:400;font-size:12px;color:#888">제이크의 폰</span></div>
  <div class="list">
    <div class="row" onclick="show('chat')"><div class="av" style="background:#e48">제</div><div class="m"><div class="n">제제 ♡</div><div class="p" id="lastp">오늘 몇 시에 끝나?</div></div><div class="t">방금<br><span class="c" id="cnt">1</span></div></div>
    <div class="row" onclick="openChat('grp')"><div class="av" style="background:#4a9">6</div><div class="m"><div class="n">나가지❌❌ <span style="color:#999;font-weight:400">6</span></div><div class="p">니키: 형들 오늘도 평화롭네요</div></div><div class="t">어제</div></div>
    <div class="row" onclick="openChat('mom')"><div class="av" style="background:#e89">M</div><div class="m"><div class="n">Mom</div><div class="p">그래 서로 잘 챙겨주고 ❤️</div></div><div class="t">월요일</div></div>
    <div class="row" onclick="openChat('mgr')"><div class="av" style="background:#79a">매</div><div class="m"><div class="n">매니저님</div><div class="p">오늘도 수고 많으셨습니다!</div></div><div class="t">월요일</div></div>
  </div>
</div>

<div id="chat" class="screen">
  <div class="top" style="background:#b2c7d9;border:0"><button onclick="show('list')">‹</button>제제 ♡<span class="sp"></span><button id="trbtn" onclick="toggleTr()" style="font-size:13px;background:#fff8;border-radius:10px;padding:3px 9px">中 翻译</button></div>
  <div id="msgs"></div>
  <div id="choices"></div>
  <div class="note">虚构角色 · 点击下方选项推进剧情</div>
  <div class="bar"><input id="inp" placeholder="자유 대화도 가능 · 직접 입력" autocomplete="off"><button id="send">전송</button></div>
</div>


<div id="view" class="screen" style="background:#b2c7d9">
  <div class="top" style="background:#b2c7d9;border:0"><button onclick="show('list')">‹</button><span id="vname"></span><span class="sp"></span><button class="trb" onclick="toggleTr()" style="font-size:13px;background:#fff8;border-radius:10px;padding:3px 9px">中 翻译</button></div>
  <div id="vmsgs" style="flex:1;min-height:0;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px"></div>
  <div class="note">这个聊天室只能查看</div>
</div>

<div id="album" class="screen" style="background:#fff">
  <div class="top"><button onclick="show('home')">‹</button>사진<span class="sp"></span><span style="font-weight:400;font-size:12px;color:#888">9</span></div>
  <div class="list"><div class="grid" id="grid"></div></div>
</div>

<div id="viewer" onclick="this.style.display='none'"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const hist=[
 {r:"o",ko:"제이크 자? 방금 웃긴 밈 봤는데 ㅋㅋㅋ 맥스 응원하다가 목 쉬었다 🏎️🔥",zh:"杰克睡了吗？刚看到个好笑的梗哈哈哈 给马克斯加油喊得嗓子都哑了"},
 {r:"me",ko:"아직 안 자 ㅋㅋ 목 쉰 소리 들리는 것 같다 이웃한테 민폐 좀 그만 끼쳐라",zh:"还没睡哈哈 感觉能听到你哑掉的声音 少给邻居添麻烦吧"},
 {r:"o",ko:"ㅋㅋㅋ 들켰다 너는 뭐 해?",zh:"哈哈哈被发现了 你在做什么？"},
 {r:"me",ko:"스케줄 하는 중이야 좀 피곤하네",zh:"在忙行程 有点累"},
 {r:"o",ko:"오늘 몇 시에 끝나?",zh:"今天几点结束？"}
];
const pad=n=>String(n).padStart(2,"0");
function tick(){const d=new Date();$("clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes());$("date").textContent=d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"})}
tick();setInterval(tick,30000);
function stamp(){const d=new Date();const h=d.getHours();return (h<12?"오전 ":"오후 ")+((h%12)||12)+":"+pad(d.getMinutes())}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");if(id==="chat"){$("cnt").style.display="none";if(!started){started=true;setTimeout(()=>play("menu"),500)}scrollDown()}}
function toggleTr(){document.body.classList.toggle("tr");const s=document.body.classList.contains("tr")?"中 隐藏":"中 翻译";$("trbtn").textContent=s;document.querySelectorAll(".trb").forEach(b=>b.textContent=s)}
function scrollDown(){const m=$("msgs");m.scrollTop=m.scrollHeight}
function addMsg(r,ko,zh,t){
  const w=document.createElement("div");w.className="b "+(r==="me"?"me":"");
  const bub=document.createElement("div");bub.className="bub";
  const k=document.createElement("div");k.textContent=ko;bub.appendChild(k);
  if(zh){const z=document.createElement("div");z.className="zh";z.textContent=zh;bub.appendChild(z)}
  const tm=document.createElement("span");tm.className="tm";tm.textContent=t||stamp();
  w.appendChild(bub);w.appendChild(tm);$("msgs").appendChild(w);scrollDown();return w;
}
function addMeme(c,z){addMsg("o",c,z)}
const d0=document.createElement("div");d0.className="day";d0.textContent="오늘";$("msgs").appendChild(d0);
const nm=document.createElement("div");nm.className="nm";nm.textContent="제제 ♡";
hist.forEach((h,i)=>{addMsg(h.r==="me"?"me":"o",h.ko,h.zh,"오전 1:"+pad(10+i*3))});

const M=(ko,zh,q)=>({ko,zh,q});
const MM=(meme,memezh)=>({ko:"",zh:"",meme,memezh});
const SC={
 hi:[[M("오 제이크 떴다 ㅋㅋㅋ 오늘 해 서쪽에서 뜸?","哦杰克上线了哈哈哈 今天太阳打西边出来了？")],[M("왔냐 ㅋㅋㅋ 나 방금 웃긴 영상 봤는데 들어볼래?","来啦哈哈哈 我刚看到个好笑的视频 要听吗"),M("아 일단 인사부터 하자 안녕!","啊先打个招呼 你好！")],[M("굿모닝~ 아니 지금 몇 시지 ㅋㅋㅋ 아무튼 안녕","早上好～不对现在几点了哈哈哈 总之你好")],[M("하이~ 나 오늘 알고리즘이 이상해서 고양이 영상만 나와 ㅋㅋㅋ","嗨～我今天的推荐算法很奇怪 全是猫视频哈哈哈")]],

function scripted(t){
  const raw=(t||"").trim();t=raw.toLowerCase();

  for(const [k,ks] of RULES){if(ks.some(w=>t.indexOf(w)>-1)){key=k;break}}
  const stripN=t.replace(/제이크|jake|杰克|제제|제이|jay|jeje|[~!?.,…ㅋㅎㅠ\s]/g,"");
  if(/제이크|jake|杰克|제제|제이|jay|jeje/.test(t)&&stripN.length<=2)key=/제이크|jake|杰克/.test(t)?"jake":"name";

  if(key==="def"&&t.replace(/\s/g,"").length<=3)key="cold";
  if(["def","cold","hi"].indexOf(key)>-1&&Math.random()<0.3)key="story";
  if(key==="love"){loveN++;key=loveN<=1?"love":loveN===2?"love2":"love3"}
  const out=pick(key,SC[key]).slice();
  if(key==="story"&&Math.random()<0.5&&out.length<4)out.push(M("제이크는 오늘 뭐 했어?","杰克你今天做了什么？","today"));
  if(key!=="sad"&&key!=="love3"&&key!=="story"&&!out.some(m=>m.meme)&&Math.random()<0.12)out.push(pick("memes",MEMES));
  pending=null;for(let i=out.length-1;i>=0;i--){if(out[i].q){pending=out[i].q;break}}
  return out;
}

async function sayMsg(m){
  if(m.n){
    const d=document.createElement("div");d.className="day nar";
    const k=document.createElement("div");k.textContent=m.ko;d.appendChild(k);
    const z=document.createElement("div");z.className="zh";z.textContent=m.zh;d.appendChild(z);

  }

  $("msgs").appendChild(t);scrollDown();

}
async function play(id){
  const sc=STORY[id];cur=id;busy=true;
  for(const m of (typeof sc.msgs==="function"?sc.msgs():(sc.msgs||[])))await sayMsg(m);

  busy=false;showChoices(sc.ch);
}
function showChoices(ch){

}
async function pickChoice(c){

  if(k==="del"){d.textContent="⌫"}else if(k){d.innerHTML=k+(l?"<small>"+l+"</small>":"")}
  if(k)d.onclick=()=>key(k);$("keys").appendChild(d)});
function drawPin(){[...$("pd").children].forEach((c,i)=>c.className=i<pin.length?"f":"")}
function openPad(){$("lk1").style.display="none";$("pad").style.display="flex";pin="";$("ptl").textContent="암호 입력";drawPin()}
function closePad(){$("pad").style.display="none";$("lk1").style.display="flex"}
function key(k){
  if(pin.length>=4)return;
  if(k==="del")pin=pin.slice(0,-1);else pin+=k;
  drawPin();
  if(pin.length===4){
    if(pin==="0420"){setTimeout(()=>{closePad();show("home")},180)}
    else{$("pd").classList.add("shake");$("ptl").textContent="암호가 틀렸습니다. 다시 시도";setTimeout(()=>{$("pd").classList.remove("shake");pin="";drawPin()},450)}
  }
}
$("send").onclick=send;
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)send()});
document.body.classList.add("tr");document.querySelectorAll(".trb").forEach(b=>b.textContent="中 隐藏");$("trbtn").textContent="中 隐藏";
buildAlbum();
show("lock");
</script>
</body>
</html>
